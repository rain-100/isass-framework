# driverlist 不需要，p6spy 通过 dynamic-datasource 包装 DataSource，
# 实际驱动在 datasource 配置的 driver-class-name 中指定
# 使用日志系统记录 sql
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 3.2.1以上使用
# MybatisPlusLogFactory
# 使用 MyBatis-Plus 提供的 P6Spy 事件监听器。它继承标准 SQL 日志监听行为，但会忽略批量执行后的结果日志，避免批量操作输出大量无意义记录。

# P6OutageFactory
# 启用慢 SQL 监控，配合：
# outagedetection=true
# outagedetectioninterval=2

modulelist=com.baomidou.mybatisplus.extension.p6spy.MybatisPlusLogFactory,com.p6spy.engine.outage.P6OutageFactory

# 单行日志：耗时|数据库地址（无连接参数）|带实参 SQL
logMessageFormat=vip.isass.framework.database.mybatisplus.config.CompactP6SpyLogMessageFormat

# 设置 p6spy driver 代理
deregisterdrivers=true

# 取消JDBC URL前缀
useprefix=false

# 配置记录 Log 例外,可去掉的结果集有error,info,batch,debug,statement,commit,rollback,result,resultset.
excludecategories=info,debug,result,commit,resultset

# 日期格式
dateformat=

# 是否开启慢SQL记录
outagedetection=true

# 慢SQL记录标准 2 秒
outagedetectioninterval=2
